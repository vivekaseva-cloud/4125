<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0e6b06" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer background badge -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Decorative Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="12 6" />

  <!-- Indian Tricolor Crest Ribbon -->
  <path d="M 96 110 L 416 110" stroke="url(#saffron)" stroke-width="8" stroke-linecap="round" />
  <path d="M 96 122 L 416 122" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M 96 134 L 416 134" stroke="url(#green)" stroke-width="8" stroke-linecap="round" />

  <!-- Center Emblem: Ashoka Chakra / News Globe Motif -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Circle Base -->
    <circle r="80" fill="#ffffff" stroke="url(#gold)" stroke-width="6" />
    <circle r="72" fill="#000080" />
    
    <!-- 24 Chakra Spokes -->
    <circle r="14" fill="#ffffff" />
    <circle r="6" fill="#000080" />
    <g stroke="#ffffff" stroke-width="2.5" opacity="0.9">
      <line x1="0" y1="-70" x2="0" y2="70" />
      <line x1="-70" y1="0" x2="70" y2="0" />
      <line x1="-50" y1="-50" x2="50" y2="50" />
      <line x1="-50" y1="50" x2="50" y2="-50" />
      <line x1="-65" y1="-26" x2="65" y2="26" />
      <line x1="-65" y1="26" x2="65" y2="-26" />
      <line x1="-26" y1="-65" x2="26" y2="65" />
      <line x1="-26" y1="65" x2="26" y2="-65" />
    </g>

    <!-- Quill Pen & Mic Overlay symbolizing Media & Journalism -->
    <path d="M -24 35 L 24 -35 M -15 45 L 35 -20" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Broadcast Signal Waves -->
  <path d="M 120 230 A 140 140 0 0 1 150 160" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 90 230 A 170 170 0 0 1 130 130" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <path d="M 392 230 A 140 140 0 0 0 362 160" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 422 230 A 170 170 0 0 0 382 130" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.5" />

  <!-- Typography: నేటి భారతం -->
  <text x="256" y="380" font-family="'Noto Sans Telugu', 'Telugu Sangam MN', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    నేటి భారతం
  </text>

  <!-- Typography: NETI BHARATHAM NEWS -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="url(#gold)" text-anchor="middle" letter-spacing="5">
    NETI BHARATHAM
  </text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.85" letter-spacing="3">
    TRUTH • DEMOCRACY • PEOPLE
  </text>
</svg>
